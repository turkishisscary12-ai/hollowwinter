
name: Build HollowWinter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project
        id: locate
        run: |
          mkdir -p source
          unzip -q HollowWinter.zip -d source
          PROJECT_DIR="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: gradle -p "${{ steps.locate.outputs.project_dir }}" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HollowWinter-Forge-1.20.1
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error

